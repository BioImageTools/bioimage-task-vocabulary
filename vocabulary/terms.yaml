# External ontology terms referenced by this vocabulary, with their labels in
# the ontology version used. Other files refer to them by id.
#
# EDAM-Bioimaging (edam:): release 1.0alpha pre-pre-release (2025-10-26), the
# one served at https://edamontology.org/EDAM-bioimaging.owl. It has no stable
# IDs yet: only the numeric ids (operation_2945 etc.) are permanent; the others
# are provisional WebProtege ids that will change. Check ids and labels with:
#   python scripts/build.py --edam-owl https://edamontology.org/EDAM-bioimaging.owl
# IAO, SIO, NCIt: labels as shown by the EBI Ontology Lookup Service (OLS).

terms:
