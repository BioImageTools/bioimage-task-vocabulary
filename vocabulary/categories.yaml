# Categories. Source of truth for categories.md (generated by scripts/build.py).
#
#   exact_match:  the EDAM class this category is named after.
#   broad_match:  for a local category with no EDAM class, the nearest broader one.
#   operations:   ids from operations.yaml. more_operations: true renders a trailing "…".
#   task_examples: a close_match on an example becomes a numbered footnote
#                 saying where EDAM files it; edam_note says where that class sits.

categories:

  - id: cat:Conversion
    label: Conversion
    exact_match: edam:operation_3434
    operations: [op:collect, op:fix, op:convert]
    task_examples:
      - label: metadata collection
      - label: metadata fixes
      - label: conversion from Yokogawa, Opera/Operetta, CZI, ND2

  - id: cat:ImageCorrection
    label: Image correction
    exact_match: edam:operation__R7MFwdgojfmkZ07yWbdcda0
    operations: [op:estimate, op:apply]
    task_examples:
      - label: illumination correction
      - label: flatfield estimation
      - label: spectral unmixing
      - label: drift correction
      - label: chromatic aberration correction

  - id: cat:ImageEnhancement
    label: Image enhancement
    exact_match: edam:operation_Image_enhancement
    operations: [op:enhance]
    task_examples:
      - label: background subtraction
      - label: denoising
      - label: smoothing
      - label: contrast enhancement
      - label: deconvolution
        close_match: edam:operation_Image_reconstruction

  - id: cat:ImageRegistration
    label: Image registration
    exact_match: edam:operation_Image_registration
    operations: [op:estimate, op:apply, op:crop]
    task_examples:
      - label: channel alignment
      - label: shift estimation
      - label: multiplex cycle registration
      - label: point cloud registration

  - id: cat:ImageReshaping
    label: Image reshaping
    broad_match: edam:operation_Image_processing
    operations: [op:project, op:rearrange, op:crop, op:rescale, op:link]
    task_examples:
      - label: projection
        close_match: edam:operation_Projection
        edam_note: under Visualisation
      - label: montage
        close_match: edam:operation_Montage
        edam_note: under Visualisation
      - label: stitching
        close_match: edam:operation_Image_stitching
        edam_note: under Image reconstruction
      - label: crop to ROI
        close_match: edam:operation__Rhb4iyLUQWY4HnhPpuqNNI
        edam_note: under Image processing
      - label: rescale
        close_match: edam:operation_Geometrical_transform
        edam_note: under Image processing

  - id: cat:ImageSegmentation
    label: Image segmentation
    exact_match: edam:operation_Image_segmentation
    operations: [op:predict, op:detect, op:split, op:filter, op:grow_shrink, op:relate]
    task_examples:
      - label: threshold segmentation
      - label: superpixel segmentation
      - label: watershed segmentation
      - label: object filtering
      - label: Cellpose
      - label: StarDist
      - label: expand labels
      - label: nucleus → cell

  - id: cat:SpotDetection
    label: Spot detection
    exact_match: edam:operation_Spot_extraction
    operations: [op:detect]
    task_examples:
      - label: spots
      - label: landmarks

  - id: cat:ObjectTracking
    label: Object tracking
    exact_match: edam:operation_Image_tracking
    operations: [op:detect, op:link, op:relabel, op:measure]
    task_examples:
      - label: particle tracking
      - label: spot tracking
      - label: object tracking with divisions
      - label: track features

  - id: cat:FilamentTracing
    label: Filament tracing
    exact_match: edam:operation__R9Qf06vxvFj2UbAk7pW3IMG
    operations: [op:trace]
    task_examples:
      - label: filament trees
      - label: filament networks

  - id: cat:ShapeConversion
    label: Shape conversion
    broad_match: edam:operation_3434
    operations: [op:vectorize, op:rasterize, op:mesh, op:smooth_simplify]
    task_examples:
      - label: labels to outlines and back
      - label: label to mesh

  - id: cat:ObjectFeatureExtraction
    label: Object feature extraction
    exact_match: edam:operation_Feature_extraction
    operations: [op:measure, op:count, op:assign]
    task_examples:
      - label: intensity
      - label: morphology
      - label: texture
      - label: colocalization
        close_match: edam:operation___Colocalisation_analysis
        edam_note: a sibling of Object feature extraction under Image analysis
      - label: neighbour distances
      - label: surface features
      - label: object counts
        close_match: edam:operation_Cell_counting
        edam_note: a sibling of Object feature extraction under Image analysis
      - label: spots per cell

  - id: cat:Classification
    label: Classification
    exact_match: edam:operation_2990
    operations: [op:classify]
    task_examples:
      - label: object classifier

  - id: cat:Clustering
    label: Clustering
    exact_match: edam:operation___Clustering
    operations: [op:cluster]
    task_examples:
      - label: spot clusters
      - label: density
      - label: phenotype clusters

  - id: cat:DataAnalysis
    label: Data analysis
    broad_match: edam:operation_2945
    operations: [op:normalize, op:aggregate, op:paint]
    more_operations: true
    task_examples:
      - label: normalization to controls
      - label: well summaries
      - label: hit calling
      - label: classes painted back into a label

  - id: cat:Validation
    label: Validation
    exact_match: edam:operation___Validation
    operations: [op:score]
    task_examples:
      - label: focus
        close_match: edam:operation___Image_validation
        edam_note: a child of Validation
      - label: saturation
        close_match: edam:operation___Image_validation
        edam_note: a child of Validation
      - label: empty FOVs
        close_match: edam:operation___Image_validation
        edam_note: a child of Validation
      - label: segmentation statistics

  - id: cat:Export
    label: Export
    broad_match: edam:operation_3434
    operations: [op:export]
    task_examples:
      - label: thumbnails
      - label: tables
      - label: meshes
