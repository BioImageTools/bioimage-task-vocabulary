# Object types. Source of truth for object_types.md (generated by scripts/build.py).
# Subtype ids are <type id>-<subtype>; operations.yaml refers to them.
#
# Mappings to ontology terms (ids from terms.yaml), with SKOS semantics:
#   exact_match    same concept
#   close_match    near enough to use interchangeably in most cases
#   narrow_match   the external term is narrower (e.g. Binary Mask is one kind of Label)
#   related_match  related but neither broader nor narrower (e.g. a point vs a point cloud)
# data_model_equivalents: the same concept in data models that are not ontologies.

object_types:

  - id: type:Image
    label: Image
    description: Pixel intensities, one or more channels.
    subtypes:
      - {id: type:Image-intensity, label: intensity}
      - {id: type:Image-probability, label: probability}
    nf_bioimage_spec: [Image]
    exact_match: [edam:data_Image]
    close_match: [IAO:0000101, SIO:000081]
    data_model_equivalents:
      - {model: SpatialData, element: images, url: 'https://spatialdata.scverse.org/en/stable/design_doc.html#images'}

  - id: type:Label
    label: Label
    description: Integers on an image grid.
    subtypes:
      - {id: type:Label-instance, label: instance, description: one ID per object}
      - {id: type:Label-class_map, label: class map, description: one value per class}
      - {id: type:Label-skeleton, label: skeleton}
    nf_bioimage_spec: [LabelMask, ClassMask, SkeletonMask]
    narrow_match: [NCIT:C201530]
    data_model_equivalents:
      - {model: SpatialData, element: labels, url: 'https://spatialdata.scverse.org/en/stable/design_doc.html#labels-pixel-mask'}
      - {model: MIFA, element: segmentation_mask, url: 'https://bioimage-archive.github.io/bia-mifa-models/AnnotationType/'}

  - id: type:Table
    label: Table
    description: Rows of values under a header.
    subtypes:
      - id: type:Table-ROI
        label: ROI
        related_match: [edam:data_Roi]
      - {id: type:Table-masking_ROI, label: masking ROI}
      - id: type:Table-feature
        label: feature
        data_model_equivalents:
          - {model: MIFA, element: counts, url: 'https://bioimage-archive.github.io/bia-mifa-models/AnnotationType/'}
          - {model: MIFA, element: derived_annotations, url: 'https://bioimage-archive.github.io/bia-mifa-models/AnnotationType/'}
      - {id: type:Table-condition, label: condition}
      - {id: type:Table-parameter, label: parameter}
    nf_bioimage_spec: [Tabular, Scalar]
    close_match: [IAO:0000306, SIO:000419]
    data_model_equivalents:
      - {model: SpatialData, element: table, url: 'https://spatialdata.scverse.org/en/stable/design_doc.html#table-table-of-annotations-for-regions'}

  - id: type:PointCloud
    label: Point cloud
    description: Points with attributes.
    nf_bioimage_spec: [Points]
    related_match: [SIO:000507]
    data_model_equivalents:
      - {model: SpatialData, element: points, url: 'https://spatialdata.scverse.org/en/stable/design_doc.html#points'}
      - {model: MIFA, element: point_annotations, url: 'https://bioimage-archive.github.io/bia-mifa-models/AnnotationType/'}

  - id: type:Vector
    label: Vector
    description: 2D polygons and lines outlining objects.
    nf_bioimage_spec: [Vector]
    narrow_match: [SIO:000505, SIO:000545]
    data_model_equivalents:
      - {model: SpatialData, element: shapes, url: 'https://spatialdata.scverse.org/en/stable/design_doc.html#shapes'}
      - {model: MIFA, element: geometrical_annotations, url: 'https://bioimage-archive.github.io/bia-mifa-models/AnnotationType/'}
      - {model: MIFA, element: bounding_boxes, url: 'https://bioimage-archive.github.io/bia-mifa-models/AnnotationType/'}

  - id: type:Mesh
    label: Mesh
    description: Vertices and faces of an object's surface.
    data_model_equivalents:
      - {model: MIFA, element: geometrical_annotations, url: 'https://bioimage-archive.github.io/bia-mifa-models/AnnotationType/'}

  - id: type:Graph
    label: Graph
    description: Objects as nodes, links as edges.
    subtypes:
      - {id: type:Graph-tree, label: tree}
      - id: type:Graph-tracks
        label: tracks
        close_match: [edam:data_Trajectory]
        data_model_equivalents:
          - {model: MIFA, element: tracks, url: 'https://bioimage-archive.github.io/bia-mifa-models/AnnotationType/'}
      - {id: type:Graph-tracks_with_divisions, label: tracks with divisions}
    nf_bioimage_spec: [SWC, Tracks, TracksWithDivision]
    data_model_equivalents:
      - {model: MIFA, element: graphs, url: 'https://bioimage-archive.github.io/bia-mifa-models/AnnotationType/'}

  - id: type:Files
    label: Files
    description: "Anything outside OME-Zarr: raw acquisition files, collected metadata, exports."
    close_match: [SIO:000396]
