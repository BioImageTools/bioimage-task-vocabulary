# Operations. Source of truth for operations.md (generated by scripts/build.py).
#
# Each signature is one row of the table:
#   inputs/outputs: ports. A port `accepts` one or more alternative types or
#                   subtypes (ids from object_types.yaml; empty = any type),
#                   and may have a `role` (roles.yaml; omit for the subject),
#                   `optional: true` and a free-text `qualifier`.
#   close_match:    closest EDAM class (terms.yaml), if any.
#   nf_bioimage_spec: matching nf-bioimage-spec category names.

operations:

  - id: op:collect
    label: collect
    signatures:
      - inputs: [{accepts: [type:Files]}]
        outputs: [{accepts: [type:Files]}]
        example: acquisition metadata of tiles and channels

  - id: op:fix
    label: fix
    signatures:
      - inputs: [{accepts: [type:Files]}]
        outputs: [{accepts: [type:Files]}]
        example: correct collected metadata
        close_match: edam:operation_3096

  - id: op:convert
    label: convert
    signatures:
      - inputs: [{accepts: [type:Files]}]
        outputs: [{accepts: [type:Image]}]
        example: write OME-Zarr from raw tiles
        close_match: edam:operation_3434

  - id: op:estimate
    label: estimate
    signatures:
      - inputs: [{accepts: [type:Image]}, {accepts: [type:Image], role: role:reference}]
        outputs: [{accepts: [type:Table-parameter]}]
        example: channel shifts
        nf_bioimage_spec: [Stitch]
      - inputs: [{accepts: [type:Image]}]
        outputs: [{accepts: [type:Image], role: role:parameter}]
        example: flatfield
      - inputs: [{accepts: [type:PointCloud]}, {accepts: [type:PointCloud], role: role:reference}]
        outputs: [{accepts: [type:Table-parameter]}]
        example: point-set registration (ICP)

  - id: op:apply
    label: apply
    signatures:
      - inputs: [{accepts: [type:Image]}, {accepts: [type:Table, type:Image], role: role:parameter}]
        outputs: [{accepts: [type:Image]}]
        example: apply shifts, flatfield
        nf_bioimage_spec: [ImgProc]
      - inputs: [{accepts: [type:PointCloud]}, {accepts: [type:Table-parameter]}]
        outputs: [{accepts: [type:PointCloud]}]
        example: move spots into the reference frame

  - id: op:enhance
    label: enhance
    signatures:
      - inputs: [{accepts: [type:Image]}]
        outputs: [{accepts: [type:Image]}]
        example: background subtraction, denoising, deconvolution
        close_match: edam:operation_Image_enhancement
        nf_bioimage_spec: [ImgProc]

  - id: op:project
    label: project
    signatures:
      - inputs: [{accepts: [type:Image]}]
        outputs: [{accepts: [type:Image]}]
        example: maximum intensity projection
        close_match: edam:operation_Projection
      - inputs: [{accepts: [type:Label]}]
        outputs: [{accepts: [type:Label]}]
        example: 3D label to 2D

  - id: op:rearrange
    label: rearrange
    signatures:
      - inputs: [{accepts: [type:Image]}]
        outputs: [{accepts: [type:Image]}]
        example: stitch, move FOVs back to their positions
        close_match: edam:operation_Image_stitching
        nf_bioimage_spec: [Stitch]

  - id: op:crop
    label: crop
    signatures:
      - inputs: [{accepts: [type:Image]}, {accepts: [type:Table-ROI], role: role:parameter, optional: true}]
        outputs: [{accepts: [type:Image]}]
        example: crop to ROI
        close_match: edam:operation__Rhb4iyLUQWY4HnhPpuqNNI

  - id: op:rescale
    label: rescale
    signatures:
      - inputs: [{accepts: [type:Image]}]
        outputs: [{accepts: [type:Image]}]
        example: bin, upscale
        close_match: edam:operation_Geometrical_transform
      - inputs: [{accepts: [type:Label]}]
        outputs: [{accepts: [type:Label]}]

  - id: op:predict
    label: predict
    signatures:
      - inputs: [{accepts: [type:Image]}]
        outputs: [{accepts: [type:Image-probability, type:Label-class_map]}]
        example: pixel classifier, semantic segmentation
        close_match: edam:operation_Pixel_classification
        nf_bioimage_spec: [PixCla]

  - id: op:detect
    label: detect
    signatures:
      - inputs: [{accepts: [type:Image]}, {accepts: [type:Label], role: role:mask, optional: true}]
        outputs: [{accepts: [type:Label-instance]}]
        example: thresholding, superpixels, Cellpose
        close_match: edam:operation_Image_segmentation
        nf_bioimage_spec: [ObjSeg]
      - inputs: [{accepts: [type:Image]}, {accepts: [type:Label], role: role:mask, optional: true}]
        outputs: [{accepts: [type:PointCloud]}]
        example: spot detection
        close_match: edam:operation_Spot_extraction
        nf_bioimage_spec: [ObjDet, LndDet]

  - id: op:split
    label: split
    signatures:
      - inputs: [{accepts: [type:Label-instance]}, {accepts: [type:Image], role: role:guide}]
        outputs: [{accepts: [type:Label-instance]}]
        example: watershed
        close_match: edam:operation_Watershed

  - id: op:filter
    label: filter
    signatures:
      - inputs: [{accepts: [type:Label-instance]}, {accepts: [type:Table-feature], role: role:guide, optional: true}]
        outputs: [{accepts: [type:Label-instance]}]
        example: remove objects by size, shape, position or feature

  - id: op:grow_shrink
    label: grow / shrink
    signatures:
      - inputs: [{accepts: [type:Label-instance]}]
        outputs: [{accepts: [type:Label-instance]}]
        example: expand, erode, fill holes
        close_match: edam:operation_Morphological_operations

  - id: op:relabel
    label: relabel
    signatures:
      - inputs: [{accepts: [type:Label-instance]}, {accepts: [type:Graph], role: role:parameter}]
        outputs: [{accepts: [type:Label-instance]}]
        example: one ID per track

  - id: op:relate
    label: relate
    signatures:
      - inputs: [{accepts: [type:Label-instance]}, {accepts: [type:Label-instance], role: role:reference}]
        outputs: [{accepts: [type:Table-feature]}]
        example: nucleus → cell
        close_match: edam:operation_____Overlap_analysis

  - id: op:link
    label: link
    signatures:
      - inputs: [{accepts: [type:Label-instance, type:PointCloud]}]
        outputs: [{accepts: [type:Graph]}]
        example: across time, cycles, z planes, FOV borders; with or without divisions
        close_match: edam:operation_Image_tracking
        nf_bioimage_spec: [PrtTrk, ObjTrk]

  - id: op:trace
    label: trace
    signatures:
      - inputs: [{accepts: [type:Image]}]
        outputs: [{accepts: [type:Graph-tree]}]
        example: filament trees
        close_match: edam:operation__R9Qf06vxvFj2UbAk7pW3IMG
        nf_bioimage_spec: [TreTrc]
      - inputs: [{accepts: [type:Image]}]
        outputs: [{accepts: [type:Label-skeleton]}]
        example: filament networks with loops
        close_match: edam:operation_Skeletonization
        nf_bioimage_spec: [LooTrc]

  - id: op:assign
    label: assign
    signatures:
      - inputs: [{accepts: [type:PointCloud]}, {accepts: [type:Label-instance], role: role:reference}]
        outputs: [{accepts: [type:Table-feature]}]
        example: spots per cell

  - id: op:rasterize
    label: rasterize
    signatures:
      - inputs: [{accepts: [type:PointCloud, type:Vector]}, {accepts: [type:Image], role: role:reference}]
        outputs: [{accepts: [type:Label-instance]}]
        example: annotations to labels
        nf_bioimage_spec: [Raster]

  - id: op:vectorize
    label: vectorize
    signatures:
      - inputs: [{accepts: [type:Label-instance]}]
        outputs: [{accepts: [type:Vector]}]
        example: object outlines
        nf_bioimage_spec: [Seg2Vec]

  - id: op:mesh
    label: mesh
    signatures:
      - inputs: [{accepts: [type:Label-instance]}]
        outputs: [{accepts: [type:Mesh]}]
        example: marching cubes

  - id: op:smooth_simplify
    label: smooth / simplify
    signatures:
      - inputs: [{accepts: [type:Mesh]}]
        outputs: [{accepts: [type:Mesh]}]

  - id: op:measure
    label: measure
    signatures:
      - inputs:
          - {accepts: [type:Label-instance]}
          - {accepts: [type:Image-intensity], optional: true}
          - {accepts: [type:Label], role: role:mask, optional: true}
        outputs: [{accepts: [type:Table-feature]}]
        example: intensity, morphology, texture
        close_match: edam:operation_Feature_extraction
        nf_bioimage_spec: [FeatExt]
      - inputs: [{accepts: [type:Mesh]}]
        outputs: [{accepts: [type:Table-feature]}]
        example: surface area, curvature
      - inputs: [{accepts: [type:Graph]}]
        outputs: [{accepts: [type:Table-feature]}]
        example: speed, displacement, lineage
        close_match: edam:operation___Trajectory_analysis

  - id: op:count
    label: count
    signatures:
      - inputs: [{accepts: [type:Image]}]
        outputs: [{accepts: [type:Table-feature], qualifier: per FOV}]
        example: objects counted without segmenting
        close_match: edam:operation_Cell_counting
        nf_bioimage_spec: [SptCnt]

  - id: op:cluster
    label: cluster
    signatures:
      - inputs: [{accepts: [type:PointCloud]}]
        outputs: [{accepts: [type:Table-feature]}]
        example: density, colocalization, phenotypes
        close_match: edam:operation___Clustering
      - inputs: [{accepts: [type:Table-feature]}]
        outputs: [{accepts: [type:Table-feature]}]

  - id: op:classify
    label: classify
    signatures:
      - inputs: [{accepts: [type:Table-feature]}]
        outputs: [{accepts: [type:Table-feature]}]
        example: object classifier
        close_match: edam:operation__RyCFuPLOeGxpcGjYbWcWWD

  - id: op:normalize
    label: normalize
    signatures:
      - inputs: [{accepts: [type:Table-feature]}, {accepts: [type:Table-condition], role: role:reference}]
        outputs: [{accepts: [type:Table-feature]}]
        example: to controls

  - id: op:aggregate
    label: aggregate
    signatures:
      - inputs: [{accepts: [type:Table-feature]}]
        outputs: [{accepts: [type:Table-feature]}]
        example: objects to wells

  - id: op:paint
    label: paint
    signatures:
      - inputs: [{accepts: [type:Label-instance]}, {accepts: [type:Table-feature], role: role:parameter}]
        outputs: [{accepts: [type:Label-class_map]}]
        example: classes back into a label

  - id: op:score
    label: score
    signatures:
      - inputs: [{accepts: [type:Image, type:Label]}]
        outputs: [{accepts: [type:Table-feature]}]
        example: focus, saturation, object counts
        close_match: edam:operation___Image_validation

  - id: op:export
    label: export
    signatures:
      - inputs: [{accepts: []}]
        outputs: [{accepts: [type:Files]}]
        example: TIFF/PNG, CSV/Parquet, meshes
        close_match: edam:operation_3434
