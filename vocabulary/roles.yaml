# Roles. Source of truth for roles.md (generated by scripts/build.py).
# A role example is rendered as "<text> in <operation>" when in_operation is set.

roles:

  - id: role:subject
    label: subject
    description: What the operation acts on. Unmarked.
    role_examples:
      - {text: the image, in_operation: op:enhance}
      - {text: the label, in_operation: op:split}

  - id: role:mask
    label: mask
    description: Restricts where the operation works.
    role_examples:
      - {text: a tissue label when cutting superpixels}
      - {text: an organoid label when measuring nuclei}

  - id: role:reference
    label: reference
    description: What the subject is aligned to or compared against.
    role_examples:
      - {text: reference channel, in_operation: op:estimate}
      - {text: cells, in_operation: op:assign}

  - id: role:parameter
    label: parameter
    description: Values the operation applies.
    role_examples:
      - {text: shifts and flatfield images, in_operation: op:apply}

  - id: role:guide
    label: guide
    description: Steers the result without being transformed.
    role_examples:
      - {text: the intensity image in watershed}
      - {text: a feature table, in_operation: op:filter}
